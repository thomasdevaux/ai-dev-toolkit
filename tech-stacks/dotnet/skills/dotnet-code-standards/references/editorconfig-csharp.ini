# Shared C# style and analyzer severities — merge into the solution root's
# .editorconfig. Named with a .ini extension in the toolkit so it does not
# get picked up as configuration for this repo itself; rename to
# `.editorconfig` (or append to the existing one) at the destination.
#
# Verified 2026-08-07. Severities set here are what EnforceCodeStyleInBuild
# in Directory.Build.props turns into build errors.

[*.cs]

# --- language conventions ------------------------------------------------
# `var` where the type is already on the right-hand side, explicit otherwise.
csharp_style_var_when_type_is_apparent = true:warning
csharp_style_var_for_built_in_types = false:warning
csharp_style_var_elsewhere = false:warning

# Modern C# the analyzers can verify is equivalent.
csharp_style_expression_bodied_methods = when_on_single_line:suggestion
csharp_style_pattern_matching_over_is_with_cast_check = true:warning
csharp_style_pattern_matching_over_as_with_null_check = true:warning
csharp_prefer_braces = true:warning
csharp_style_namespace_declarations = file_scoped:warning
csharp_using_directive_placement = outside_namespace:warning

dotnet_style_readonly_field = true:warning
dotnet_style_require_accessibility_modifiers = always:warning
dotnet_style_coalesce_expression = true:warning
dotnet_style_null_propagation = true:warning
dotnet_style_prefer_conditional_expression_over_assignment = true:suggestion

# --- naming --------------------------------------------------------------
dotnet_naming_rule.private_fields_underscore.severity = warning
dotnet_naming_rule.private_fields_underscore.symbols = private_fields
dotnet_naming_rule.private_fields_underscore.style = underscore_camel

dotnet_naming_symbols.private_fields.applicable_kinds = field
dotnet_naming_symbols.private_fields.applicable_accessibilities = private

dotnet_naming_style.underscore_camel.required_prefix = _
dotnet_naming_style.underscore_camel.capitalization = camel_case

# --- analyzer severities the defaults get wrong ---------------------------
# Catching Exception is a boundary decision, not a code smell — rules/style.md
# requires a comment instead, which no analyzer can check.
dotnet_diagnostic.CA1031.severity = suggestion

# ConfigureAwait(false) in library code. Set to `none` in an application
# where there is no synchronization context to deadlock against.
dotnet_diagnostic.CA2007.severity = warning

# Cancellation tokens must be forwarded, not dropped.
dotnet_diagnostic.CA2016.severity = warning

# Async methods that never await, and sync-over-async.
dotnet_diagnostic.CS1998.severity = warning

# Unused usings and unused private members: mechanically fixable, so there is
# no reason to let them accumulate.
dotnet_diagnostic.IDE0005.severity = warning
dotnet_diagnostic.IDE0051.severity = warning

[*.{cs,vb}]
dotnet_sort_system_directives_first = true
dotnet_separate_import_directive_groups = false

- id: tech-stack-python
  type: file
  source: tech-stacks/python
  target: .claude/
  scope: project
  tier: tech-stack
  detect: ["pyproject.toml", "requirements.txt", "setup.py"]
  summary: Python coding standards (ruff, mypy, uv pinning) plus desktop architecture - PySide6/tkinter common layout, scripts and check gate, packaging, protecting sensitive logic.
  # The .editorconfig baseline is identical for every stack. It lives once in
  # the checkout and is deployed into each code-standards skill at sync time,
  # so the copies cannot drift — same mechanism as react-conventions.md.
  shared_files:
    - source: tech-stacks/shared/editorconfig.ini
      target: skills/python-code-standards/references/editorconfig.ini
    - source: tech-stacks/shared/corporate-proxy.md
      target: skills/python-code-standards/references/corporate-proxy.md
    # Same installer pieces as the Go stack (user PATH entry, in-place update,
    # NSIS without admin): one copy in the checkout, deployed to both.
    - source: tech-stacks/shared/nsis/path.nsh
      target: skills/python-desktop-architecture/references/nsis/path.nsh
    - source: tech-stacks/shared/nsis/upgrade.nsh
      target: skills/python-desktop-architecture/references/nsis/upgrade.nsh
    - source: tech-stacks/shared/nsis/install-nsis.md
      target: skills/python-desktop-architecture/references/nsis/install-nsis.md

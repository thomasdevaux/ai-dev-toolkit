# Shared .editorconfig baseline — copy to the project root as `.editorconfig`.
# Named with a .ini extension in the toolkit so it stays inert inside this
# checkout; the destination filename is `.editorconfig`.
#
# This file is identical across every stack: it settles the things an editor
# decides before any language tooling runs — encoding, line endings, trailing
# whitespace, final newline. Formatters disagree with each other about a lot,
# but not about these, and getting them wrong produces diffs that are pure
# noise.
#
# A .NET solution merges this with the C# section from
# `editorconfig-csharp.ini`; the two do not overlap.

root = true

[*]
charset = utf-8
end_of_line = lf
insert_final_newline = true
trim_trailing_whitespace = true
indent_style = space
indent_size = 4

[*.{js,jsx,ts,tsx,json,jsonc,css,scss,html,yml,yaml}]
indent_size = 2

[*.go]
# gofmt uses tabs and is not configurable. Stating it here keeps editors from
# fighting the formatter.
indent_style = tab

[Makefile]
indent_style = tab

[*.md]
# Trailing double-space is a line break in Markdown; stripping it silently
# changes rendered output.
trim_trailing_whitespace = false

[*.{bat,cmd,ps1}]
end_of_line = crlf

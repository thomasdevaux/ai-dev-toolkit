# Manifest for tools/sync — the single source of truth for what can be synced
# into a project, at which tier, and under what one-line summary.
#
# Only mature content appears here. Blocks that aren't validated yet live in
# incubator/ and are deliberately absent, so a consuming project can't adopt
# something nobody has used; see incubator/README.md.
#
# Third-party content is vendored under vendor/<name>/ with a SOURCE.md
# recording upstream, pin and license, rather than installed as a plugin —
# see handbook/plugins-policy.md for when we do which.
#
# The three process/* variants are mutually exclusive via
# tier: choice-group:process, blocked at sync time.
#
# Entry fields:
#   id             unique identifier, used on the CLI and in the state file
#   type           "file" (default) or "official-plugin"
#   source         path relative to the toolkit checkout root (type: file only)
#   target         path relative to .claude/ or ~/.claude/ (type: file only)
#   scope          "project" or "user"
#   tier           "baseline" | "choice-group:<name>" | "tech-stack" | "suggested"
#                  | "optional"
#                  baseline   expected everywhere; reported as missing
#                  tech-stack suggested from detect markers only
#                  suggested  listed as available, never pressed
#                  optional   never surfaced at all; opt-in by id
#   summary        one line, shown in the status report and the user-guide
#   detect         list of marker filenames that suggest this entry (stacks)
#   plugin_ref     "<plugin>@<marketplace>" (type: official-plugin only)
#   settings_patch top-level settings.json keys to merge in, key by key

- id: common-rules
  type: file
  source: common
  target: .claude/
  scope: project
  tier: baseline
  summary: Org-wide rules and always-available skills - security, git workflow, language, process profile, code navigation, output compression.
  settings_patch:
    hooks:
      SessionStart:
        - hooks:
            - type: command
              command: "\"$CLAUDE_PROJECT_DIR\"/.claude/hooks/codegraph-freshness.sh"

- id: common-rules-user
  type: file
  source: common
  target: ~/.claude/
  scope: user
  tier: baseline
  summary: The same common block at user scope, so a session opened in any folder still has it.
  settings_patch:
    hooks:
      SessionStart:
        - hooks:
            - type: command
              command: "\"$HOME\"/.claude/hooks/codegraph-freshness.sh"

- id: context-quality
  type: file
  source: context-quality
  target: .claude/
  scope: project
  tier: baseline
  summary: AGENTS.md as the single context file - fixed skeleton, init and audit skills, session-start check.
  settings_patch:
    hooks:
      SessionStart:
        - hooks:
            - type: command
              command: "\"$CLAUDE_PROJECT_DIR\"/.claude/hooks/context-check.sh"

- id: gitlab
  type: official-plugin
  plugin_ref: "gitlab@claude-plugins-official"
  scope: project
  tier: baseline
  summary: Official GitLab plugin - merge requests, issues, pipelines.
  settings_patch:
    enabledPlugins:
      "gitlab@claude-plugins-official": true

- id: process-none
  type: file
  source: process/none
  target: .claude/
  scope: project
  tier: choice-group:process
  summary: No process - scripts and one-offs, nothing to maintain long-term.

- id: process-light
  type: file
  source: process/light
  target: .claude/
  scope: project
  tier: choice-group:process
  summary: The default discipline - doc map, requirements, decisions, testing policy, desktop stack selection.

- id: process-full
  type: file
  source: process/full
  target: .claude/
  scope: project
  tier: choice-group:process
  summary: Critical or certified projects - extra rigor, not designed yet (stub).

- id: tech-stack-python
  type: file
  source: tech-stacks/python
  target: .claude/
  scope: project
  tier: tech-stack
  detect: ["pyproject.toml", "requirements.txt", "setup.py"]
  summary: Python desktop architecture - PySide6/tkinter structure, packaging, protecting sensitive logic.

- id: tech-stack-rust
  type: file
  source: tech-stacks/rust
  target: .claude/
  scope: project
  tier: tech-stack
  detect: ["Cargo.toml"]
  summary: Rust + Tauri desktop architecture - the webview branch, React conventions included.


- id: tech-stack-go
  type: file
  source: tech-stacks/go
  target: .claude/
  scope: project
  tier: tech-stack
  detect: ["go.mod"]
  summary: Go + Wails desktop architecture - the webview branch, React conventions included.

- id: tech-stack-dotnet
  type: file
  source: tech-stacks/dotnet
  target: .claude/
  scope: project
  tier: tech-stack
  detect: ["*.csproj", "*.sln"]
  summary: .NET + Avalonia desktop architecture - MVVM structure, Native AOT publishing.

- id: user-statusline
  type: file
  source: user-tools/statusline
  target: ~/.claude/
  scope: user
  tier: baseline
  summary: Status line showing model, context usage and rate limits - the one always-on token feedback.
  settings_patch:
    statusLine:
      type: command
      command: "python ~/.claude/statusline.py"

- id: toolkit-self-check
  type: file
  source: self-check
  target: .claude/
  scope: project
  tier: baseline
  summary: SessionStart hook reporting toolkit onboarding and drift for this project.
  settings_patch:
    hooks:
      SessionStart:
        - hooks:
            - type: command
              command: "\"$CLAUDE_PROJECT_DIR\"/.claude/hooks/toolkit-drift-check.sh"

- id: toolkit-self-check-user
  type: file
  source: self-check
  target: ~/.claude/
  scope: user
  tier: baseline
  summary: The same drift check at user scope, so it also fires in never-synced projects.
  settings_patch:
    hooks:
      SessionStart:
        - hooks:
            - type: command
              command: "\"$HOME\"/.claude/hooks/toolkit-drift-check.sh"

# Official language servers, all at user scope. Measured context cost is zero
# (no skill, command or agent), and ~/.claude applies in every folder — which is
# the only way a scratch script session gets them, since it never syncs anything.
# See docs/decisions.md#d-12.

- id: pyright-lsp-user
  type: official-plugin
  plugin_ref: "pyright-lsp@claude-plugins-official"
  scope: user
  tier: baseline
  summary: Official Python language server.
  settings_patch:
    enabledPlugins:
      "pyright-lsp@claude-plugins-official": true


# type: official-plugin entries with no block directory of their own — a
# plugin_ref and a settings_patch, nothing to vendor or read. Grouped here,
# by category, rather than scattered across directories that don't exist for
# them; each section below stays self-contained so it can be split into its
# own file the day it outgrows a quick scan.
#
# Nothing at tier: suggested lives here — a suggested plugin gets its own
# directory under suggested/, same as any other opt-in block.

# --- Project-scope, tech-stack ---

- id: tech-stack-frontend-design
  type: official-plugin
  plugin_ref: "frontend-design@claude-plugins-official"
  scope: project
  tier: tech-stack
  detect: ["package.json"]
  summary: Official frontend-design plugin - UI/component design guidance for web frontends.
  settings_patch:
    enabledPlugins:
      "frontend-design@claude-plugins-official": true

# --- Official language servers, all at user scope. Measured context cost is
# zero (no skill, command or agent), and ~/.claude applies in every folder —
# which is the only way a scratch script session gets them, since it never
# syncs anything. ---

- id: pyright-lsp-user
  type: official-plugin
  plugin_ref: "pyright-lsp@claude-plugins-official"
  scope: user
  tier: baseline
  summary: Official Python language server.
  group: Language servers
  features: ["Python"]
  settings_patch:
    enabledPlugins:
      "pyright-lsp@claude-plugins-official": true


# Copy to the project root. One compiler for every machine and for CI: changing
# the toolchain is a commit, reviewed like any other. Use the newest stable the
# team has validated; after bumping it, run `rustup update` then
# `cargo sweep --installed` (see build-and-disk.md).
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]

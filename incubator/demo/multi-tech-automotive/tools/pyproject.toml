[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-flash-tool"
version = "0.1.0"
description = "Dummy Python flashing tool in the combined automotive demo, exercising stacks/python's packaging rule alongside the C and model files above."
requires-python = ">=3.10"

[project.scripts]
automotive-flash-tool = "automotive_flash_tool.cli:main"

- id: tech-stack-go
  type: file
  source: tech-stacks/go
  target: .claude/
  scope: project
  tier: tech-stack
  # go.mod marks any Go module, which is the intended reach for this block's
  # coding standards. Same reasoning as tech-stacks/rust — see that manifest.
  detect: ["go.mod"]
  summary: Go coding standards (gofumpt, golangci-lint) plus the Wails 3 desktop architecture - the webview branch, React conventions included.
  # React is the mandated frontend for both webview stacks, so this file
  # is identical in each. It lives once in the checkout and is deployed
  # into the block at sync time — the synced skill stays self-contained,
  # the two copies cannot drift.
  shared_files:
    - source: tech-stacks/shared/react-conventions.md
      target: skills/go-webview-desktop-architecture/references/react-conventions.md
    - source: tech-stacks/shared/editorconfig.ini
      target: skills/go-code-standards/references/editorconfig.ini
    - source: tech-stacks/shared/corporate-proxy.md
      target: skills/go-code-standards/references/corporate-proxy.md
    # Sourced by every script that reaches npm; identical for Tauri and Wails.
    - source: tech-stacks/shared/node-env.ps1
      target: skills/go-webview-desktop-architecture/references/node-env.ps1
    # The Windows installer pieces (user PATH entry, in-place update) are plain
    # NSIS includes with no Wails dependency beyond its generated defines; they
    # live once so a Python/PyInstaller installer can deploy the same files.
    - source: tech-stacks/shared/nsis/path.nsh
      target: skills/go-webview-desktop-architecture/references/nsis/path.nsh
    - source: tech-stacks/shared/nsis/upgrade.nsh
      target: skills/go-webview-desktop-architecture/references/nsis/upgrade.nsh

    - source: tech-stacks/shared/nsis/install-nsis.md
      target: skills/go-webview-desktop-architecture/references/nsis/install-nsis.md
